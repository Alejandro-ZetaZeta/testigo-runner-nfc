name: iOS Builder (MobAI)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-builder.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-builder.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-ios:
    name: Build iOS RelayBaton App & Simulator / IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build iOS App (.app for Simulator)
        run: |
          xcodebuild \
            -project ios/RelayBaton.xcodeproj \
            -scheme RelayBaton \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RelayBaton.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r RelayBaton.ipa Payload
            cd ..
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayBaton-IPA
          path: build-output/RelayBaton.ipa
          if-no-files-found: warn

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayBaton-App-Bundle
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/*-iphonesimulator/RelayBaton.app
          if-no-files-found: warn
